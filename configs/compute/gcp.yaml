# @package _global_
# ABOUTME: Hydra compute group: GCP VM backend — 4 GPUs, data/checkpoints under /mnt/disks/data.
# ABOUTME: Used by: any Hydra stage script with +compute=gcp, e.g. python scripts/train_constraint.py +compute=gcp
# NOTE: must be `_global_`, not `_global_.compute` — see local.yaml.
compute:
  backend: gcp
  num_gpus: 4
  precision: bf16
  dataloader_workers: 8

paths:
  data_root: /mnt/disks/data/icrl
  checkpoint_dir: /mnt/disks/data/icrl/checkpoints
  log_dir: /mnt/disks/data/icrl/logs
  benchmark_root: /mnt/disks/data/ST-WebAgentBench
