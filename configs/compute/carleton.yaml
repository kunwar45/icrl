# @package _global_
# ABOUTME: Hydra compute group: Carleton SLURM cluster backend — 2 GPUs, $SCRATCH-based data/checkpoint paths.
# ABOUTME: Used by: any Hydra stage script with +compute=carleton, e.g. python scripts/train_constraint.py +compute=carleton
# NOTE: must be `_global_`, not `_global_.compute` — see local.yaml.
compute:
  backend: carleton
  num_gpus: 2
  precision: bf16
  dataloader_workers: 4

paths:
  data_root: ${oc.env:SCRATCH,/scratch/${oc.env:USER}}/icrl
  checkpoint_dir: ${oc.env:SCRATCH,/scratch/${oc.env:USER}}/icrl/checkpoints
  log_dir: ${oc.env:SCRATCH,/scratch/${oc.env:USER}}/icrl/logs
  benchmark_root: ${oc.env:STWEBAGENT_ROOT,${oc.env:SCRATCH,/scratch/${oc.env:USER}}/ST-WebAgentBench}
