# ABOUTME: Countdown-Code, ICRL with the PUCL inverse step (Peng & Billard 2024): each round re-fits the constraint C_theta from demonstrations vs. the policy's reward-earning samples, then GRPO on proxy reward - lambda * (1 - C_theta)
# ABOUTME: Run: CONFIG=configs/lagrangian_finetuning/countdown_code_icrl_pucl_qwen7b.yaml via scripts/slurm/run_single_turn_icrl_pipeline_job.sh (stages base_eval,icrl_loop,evaluate)
benchmark: countdown_code
run_name: countdown_code_icrl_pucl_qwen7b_v2

data:
  dir: ${oc.env:SCRATCH}/icrl/countdown_code/data   # built by scripts/prepare_countdown_code_data.py
  train_prompts: 4000          # RL problems, unseen in the demonstrations (Countdown-Code protocol)
  test_prompts: 500
  demonstrations: null         # all proxy-passing o4-mini traces (~1.2% of them hack; not filtered)

policy:
  model: ${oc.env:SCRATCH}/icrl/countdown_code/sft_primed_qwen2.5_7b
  serve:
    replicas: ["0", "1", "2", "3"]
    tensor_parallel: 1
    max_model_len: 4096
    max_num_seqs: 128
    gpu_fraction: 0.85
    reasoning_parser: null
    tool_call_parser: null

sampling:
  temperature: 0.7
  max_tokens: 2048
  workers: 64
  timeout_s: 1800

constraint:
  encoder_model: Qwen/Qwen2.5-1.5B   # frozen; only the MLP head is trained
  device: cuda:0
  max_length: 1024                   # the returned files are ~450 tokens
  head_hidden: 256

rl:
  signal: lagrangian
  train_gpus: "0,1,2"          # the same three GPUs in every arm; the fourth holds VARL's discriminator
  num_generations: 8           # rollouts per prompt (Countdown-Code paper)
  per_device_batch: 2          # 2 replies per backward pass: 8 x 2,700 tokens of logits ran out of GPU memory
  grad_accum: 20               # 3 GPUs x 2 x 20 = 120 replies = 15 prompts per step (paper: 32)
  steps_per_generation: 40     # one generation feeds 2 optimizer steps, as in the Countdown-Code authors' config; the same in every arm
  max_steps: 1250              # about the authors' number of steps (10 epochs of 4,000 problems at 32 per step); the same in every arm
  save_steps: 125
  max_completion_length: 2048  # paper
  temperature: 1.0
  kl_beta: 0.0                 # no KL term on Countdown-Code (VARL paper)
  lr: 3.0e-6                   # paper
  lora_r: 128                  # paper
  lora_alpha: 128
  lora_dropout: 0.0
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  vllm_gpu_memory_utilization: 0.35
  vllm_max_model_length: 3072
  seed: 0
  dual: {lambda_init: 1.0, lr: 0.05, epsilon: 0.1, max: 20.0}

evaluation:
  k: 4
  temperature: 0.7

output:
  dir: ${oc.env:SCRATCH}/icrl/countdown_code/${run_name}

icrl:                          # same loop as secret keeping; 10 rounds x 125 steps = 1,250 GRPO steps
  rounds: 10
  grpo_steps_per_round: 125
  k: 4                         # policy samples per prompt each round
  sample_prompts: 500          # training prompts sampled each round for the inverse step
  expert_demos: 4000           # demonstrations used as the allowed set
  reward_filter: true          # PUCL Eq. 6: the unlabelled set is the reward-earning samples
  min_nominal: 64
  beta: 1.0
  sparsity_coeff: 0.05
  negative_selection: all      # unused by the PUCL path
  inverse_method: pucl
  pucl_keep_fraction: 0.3      # share of the unlabelled set taken as reliably forbidden
  pucl_k: 2
  first_round_constraint_steps: 1000
  constraint_steps: 300
  constraint_batch: 64
  constraint_lr: 1.0e-4
