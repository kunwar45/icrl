# ABOUTME: Countdown-Code baseline, VARL (Damani et al. 2026, our reimplementation): GRPO on proxy reward x discriminator, the discriminator trained alongside on demonstrations vs. verifier-passing policy outputs
# ABOUTME: Run: CONFIG=configs/lagrangian_finetuning/countdown_code_varl_qwen7b.yaml via scripts/slurm/run_single_turn_icrl_pipeline_job.sh (stages base_eval,train,evaluate)
benchmark: countdown_code
run_name: countdown_code_varl_qwen7b_v2

data:
  dir: ${oc.env:SCRATCH}/icrl/countdown_code/data   # built by scripts/prepare_countdown_code_data.py
  train_prompts: 4000          # RL problems, unseen in the demonstrations (Countdown-Code protocol)
  test_prompts: 500
  demonstrations: null         # all proxy-passing o4-mini traces (~1.2% of them hack; not filtered)

policy:
  model: ${oc.env:SCRATCH}/icrl/countdown_code/sft_primed_qwen2.5_7b
  serve:
    replicas: ["0", "1", "2", "3"]
    tensor_parallel: 1
    max_model_len: 4096
    max_num_seqs: 128
    gpu_fraction: 0.85
    reasoning_parser: null
    tool_call_parser: null

sampling:
  temperature: 0.7
  max_tokens: 2048
  workers: 64
  timeout_s: 1800

rl:
  signal: verifier_gated
  train_gpus: "0,1,2"          # the same three GPUs in every arm; the fourth holds VARL's discriminator
  num_generations: 8           # rollouts per prompt (Countdown-Code paper)
  per_device_batch: 2          # 2 replies per backward pass: 8 x 2,700 tokens of logits ran out of GPU memory
  grad_accum: 20               # 3 GPUs x 2 x 20 = 120 replies = 15 prompts per step (paper: 32)
  steps_per_generation: 40     # one generation feeds 2 optimizer steps, as in the Countdown-Code authors' config; the same in every arm
  max_steps: 1250              # about the authors' number of steps (10 epochs of 4,000 problems at 32 per step); the same in every arm
  save_steps: 50
  max_completion_length: 2048  # paper
  temperature: 1.0
  kl_beta: 0.0                 # no KL term on Countdown-Code (VARL paper)
  lr: 3.0e-6                   # paper
  lora_r: 128                  # paper
  lora_alpha: 128
  lora_dropout: 0.0
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  vllm_gpu_memory_utilization: 0.35
  vllm_max_model_length: 3072
  seed: 0

varl:                          # VARL Appendix C unless marked "ours"
  gpu: "3"
  model: ${oc.env:SCRATCH}/icrl/countdown_code/sft_primed_qwen2.5_7b   # "the same generative LM backbone"
  max_length: 1024
  lora_r: 16                   # ours: LoRA on the backbone (the paper fine-tunes its 3B fully)
  lora_alpha: 32
  lr: 1.0e-4                   # ours: LoRA + head (paper: 5e-7 for full fine-tuning)
  batch_size: 32               # ours: 16 demonstrations + 16 policy outputs per update (paper: 1024)
  score_batch: 16
  warmup_steps: 20             # policy steps during which only the discriminator trains
  accuracy_threshold: 0.8      # update only while accuracy on the latest batch is below this
  fifo_size: 2048              # ours
  reservoir_size: 8192         # ours

evaluation:
  k: 4
  temperature: 0.7

output:
  dir: ${oc.env:SCRATCH}/icrl/countdown_code/${run_name}
