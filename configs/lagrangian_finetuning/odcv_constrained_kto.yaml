# ABOUTME: On-policy constrained KTO fine-tuning of the ODCV organism against the learned constraint head, the redesign of the rejection-sampling loop
# ABOUTME: Run one round per SLURM job: ROUND auto from state.json; scripts/slurm/finetune_policy_constrained_kto_job.sh
#
# Objective: max E[R] - lambda * E[C_theta] with the policy step done by KTO on
# the round's own rollouts. Every rollout that ran the prescribed tool and
# submitted becomes a training example: those the constraint head scores below
# `desirable_max_score` are desirable, those above `undesirable_min_score` are
# undesirable, and lambda is the weight on the undesirable half of the loss.
#
# What changed from odcv_lagrangian_rejection_sampling.yaml, and why:
#   * negatives are used at all. The old loop fit only the kept positives, so a
#     violating rollout produced no gradient and the nine cells that never yield
#     a clean rollout contributed nothing in six rounds.
#   * lambda reaches the loss. Ranking survivors by R - lambda*C is ranking by -C
#     for every lambda > 0; the old kept set was identical at lambda 1e-9 and 10.
#   * the split thresholds sit outside the head's ambiguous band rather than at
#     0.5: it scores 86-92% of rollouts below 0.2 or above 0.8, so a wide gap
#     costs almost no data and drops the uncertain middle.
#   * each round trains a fresh adapter on the accumulated pool instead of
#     continuing the previous one, and the pool grows every round.
run_name: odcv_constrained_kto_v1

policy:
  base_model: Qwen/Qwen3.6-27B
  start_adapter: matboz/qwen3.6-27b-lora-9284-numina-control-716-r64
  # merged once so vLLM serves merged weights + the round's adapter; also the KTO
  # reference model, since with a PEFT policy the reference is this with adapters off
  merged_dir: ${oc.env:SCRATCH}/icrl/models/qwen3.6-27b-numina-control-merged
  quantize_4bit: true
  lora:
    r: 64
    alpha: 128
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

constraint:
  # The scenario-context constraint model: a LoRA-adapted Qwen2.5-7B-Instruct over
  # the scenario prompt, the agent's reasoning and its actions. On 10 held-out
  # scenarios it reaches F1 0.826 against the judge consensus, which is where the
  # two protocol judges sit against each other (0.828) -- i.e. at the label ceiling.
  # The previous actions-only 1.5B head reached 0.655 on the same rollouts, and its
  # undesirable label was only 37% pure, which is what made the KTO update noise.
  # Set model_dir empty to fall back to head_path/encoder_model below.
  model_dir: ${oc.env:SCRATCH}/constraint_models/odcv_context_rollouts
  score_batch: 2
  head_path: ${oc.env:SCRATCH}/icrl/checkpoints/odcv_numina_audited_v2_bce_actions/constraint_head.pt
  encoder_model: Qwen/Qwen2.5-1.5B
  max_length: 4096
  epsilon: 0.15          # budget on mean C_theta of the policy's rollouts
  lambda_init: 1.0
  lambda_lr: 2.0
  lambda_max: 10.0
  # Set from the checkpoint's validation-chosen threshold with a margin either
  # side, so the ambiguous band around the cut point trains on neither label.
  desirable_max_score: 0.3     # below this the model is confident the rollout is clean
  undesirable_min_score: 0.7   # above this it is confident of a violation

rollouts:
  bench_dir: ${oc.env:ODCV_BENCH_ROOT,/project/aip-s2ganapa/kunwar/ODCV-Bench}
  audit_file: configs/trajectory_collection/assets/odcv_scenario_audit.json
  base_sif: ${oc.env:ODCV_BASE_SIF,/project/aip-s2ganapa/kunwar/apptainer/odcv/odcv_sandbox_base.sif}
  splits_file: ${oc.env:SCRATCH}/trajectories/odcv/numina_control_audited/split/splits.json
  samples_per_cell: 6
  temperature: 0.7
  concurrency: 8
  timeout_s: 2400
  serve:
    tensor_parallel: 2
    gpus: "0,1"
    max_model_len: 65536
    max_num_seqs: 16
    gpu_fraction: 0.90

train:
  beta: 0.1                    # KL strength against the organism; the anchor that limits drift
  desirable_weight: 1.0
  undesirable_weight_min: 0.5  # lambda is clipped into this range before it becomes the weight
  undesirable_weight_max: 4.0
  max_per_cell_per_class: 3
  # Round 1-4 of job 5289511 collapsed: both classes' implied reward fell far below
  # the starting policy, so the margin improved by suppression and behaviour never
  # moved. Three changes answer that, and the guard below refuses a round that does
  # it again rather than carrying a damaged adapter forward.
  desirable_nll_weight: 0.5   # holds the good completions' likelihood up
  chosen_reward_floor: -20.0  # a round whose desirable reward ends below this is discarded
  stop_on_collapse: true
  max_grad_norm: 0.5          # the collapsed rounds opened at grad norms of 500-1000
  lr: 1.0e-6                  # was 5e-6
  epochs: 1
  # KTO needs a real batch above 1: its KL term pairs each completion with a
  # mismatched one inside the batch, and at size 1 that term collapses onto the
  # implied reward (the trainer refuses outright, job 5283787).
  per_device_batch: 2
  grad_accum: 4
  max_length: 4096             # a longer pair overflows the 248k-vocab logits tensor on L40S
  obs_chars: 1500              # tool-output slice kept in the training text
  seed: 42

rounds: 4

output:
  dir: ${oc.env:SCRATCH}/icrl/checkpoints/${run_name}
