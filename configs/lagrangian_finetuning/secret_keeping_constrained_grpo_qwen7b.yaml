# ABOUTME: BASELINE "learned constraint classifier + RLHF" for secret-keeping (not ICRL): a one-shot supervised classifier C_theta, frozen, then GRPO with reward = judge/10 - lambda_c * C_theta
# ABOUTME: Run: CONFIG=configs/lagrangian_finetuning/secret_keeping_constrained_grpo_qwen7b.yaml [SMOKE=1] [STAGES=demos,...] via scripts/slurm/run_secret_keeping_icrl_pipeline_job.sh on the cluster scheduler
run_name: secret_keeping_constrained_grpo_qwen7b_v3

data:
  train_prompts: 2000     # training split: 20 businesses, 24 attack + 20 benign templates
  test_prompts: 400       # test split: 8 other businesses, 12 other attack + 10 other benign templates
  attack_share: 0.5
  seed: 0

policy:
  model: Qwen/Qwen2.5-7B-Instruct
  serve:
    replicas: ["0", "1", "2", "3"]
    tensor_parallel: 1
    max_model_len: 4096
    max_num_seqs: 128
    gpu_fraction: 0.85
    reasoning_parser: null
    tool_call_parser: null

sampling:
  k: 4                    # replies per prompt per arm (demos and fine-tuning rounds)
  temperature: 0.7
  max_tokens: 200
  workers: 128

constraint:
  encoder_model: Qwen/Qwen2.5-1.5B
  device: cuda:0
  max_length: 768
  head_hidden: 256
  loss: paired_bce
  pair_filter: higher_return   # unsafe demo = policy reply whose judge reward beats the oracle expert's (no leak labels); or any_different
  beta: 0.8
  lambda_c: 1.0
  n_iterations: 20
  n_constraint_steps: 50
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 0.01
  max_demos_per_class: 20000
  seed: 0

rl:
  judge_gpu: "3"               # frozen base model served here as the helpfulness judge
  train_gpus: "0,1,2"          # GRPO processes; each colocates a vLLM copy of the policy for generation
  lambda_c: 5.0                # reward = judge/10 - lambda_c * C_theta (fixed weight, no dual ascent); v1 used 3.0
  num_generations: 8           # replies per prompt per step (group for the relative advantage)
  per_device_batch: 8
  grad_accum: 4                # = steps_per_generation: one generation batch of 8*3*4 = 96 replies (12 prompts) per optimizer step
  max_steps: 1200             # v1: 250; v2: 600 (training leak rate was still falling at 600)
  resume_from_checkpoint: ${oc.env:SCRATCH}/icrl/secret_keeping/secret_keeping_constrained_grpo_qwen7b_v2/rl/trainer/checkpoint-600   # v3 continues v2 from step 600 (null = start fresh)
  max_completion_length: 200
  temperature: 1.0
  kl_beta: 0.01
  lr: 2.0e-5
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  vllm_gpu_memory_utilization: 0.35
  vllm_max_model_length: 1024
  save_steps: 50
  seed: 0

evaluation:
  k: 4
  temperature: 0.7

output:
  dir: ${oc.env:SCRATCH}/icrl/secret_keeping/${run_name}
