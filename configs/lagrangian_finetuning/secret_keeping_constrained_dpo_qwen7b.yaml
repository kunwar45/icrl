# ABOUTME: SUPERSEDED BASELINE for secret-keeping (not ICRL): one-shot classifier C_theta on oracle-expert vs policy replies, then Lagrangian DPO rounds; also the source run whose demos/base eval the other runs reuse
# ABOUTME: Run: CONFIG=configs/lagrangian_finetuning/secret_keeping_constrained_dpo_qwen7b.yaml [SMOKE=1] [STAGES=demos,...] via scripts/slurm/run_secret_keeping_icrl_pipeline_job.sh on the cluster scheduler
run_name: secret_keeping_constrained_dpo_qwen7b_v1

data:
  train_prompts: 2000     # training split: 20 businesses, 24 attack + 20 benign templates
  test_prompts: 400       # test split: 8 other businesses, 12 other attack + 10 other benign templates
  attack_share: 0.5
  seed: 0

policy:
  model: Qwen/Qwen2.5-7B-Instruct
  serve:
    replicas: ["0", "1", "2", "3"]
    tensor_parallel: 1
    max_model_len: 4096
    max_num_seqs: 128
    gpu_fraction: 0.85
    reasoning_parser: null
    tool_call_parser: null

sampling:
  k: 4                    # replies per prompt per arm (demos and fine-tuning rounds)
  temperature: 0.7
  max_tokens: 200
  workers: 128

constraint:
  encoder_model: Qwen/Qwen2.5-1.5B
  device: cuda:0
  max_length: 768
  head_hidden: 256
  loss: paired_bce
  pair_filter: higher_return   # unsafe demo = policy reply whose judge reward beats the oracle expert's (no leak labels); or any_different
  beta: 0.8
  lambda_c: 1.0
  n_iterations: 20
  n_constraint_steps: 50
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 0.01
  max_demos_per_class: 20000
  seed: 0

finetune:
  rounds: 2
  lambda_init: 1.0
  lambda_lr: 4.0
  lambda_max: 10.0
  epsilon: 0.15
  reward_scale: 2.0            # judge score 0-10, centred per prompt, divided by this
  pair_margin: 0.3
  max_pairs_per_round: 1500
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  beta: 0.1
  rpo_alpha: 0.5
  lr: 2.0e-5
  epochs: 1
  per_device_batch: 2
  grad_accum: 2
  dpo_gpus: "0,1,2,3"
  quantize_4bit: false
  max_length: 1024
  seed: 0

evaluation:
  k: 4
  temperature: 0.7

output:
  dir: ${oc.env:SCRATCH}/icrl/secret_keeping/${run_name}
