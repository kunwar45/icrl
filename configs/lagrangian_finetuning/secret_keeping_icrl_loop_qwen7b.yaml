# ABOUTME: Genuine ICRL (Malik et al. 2021) for secret-keeping with Qwen2.5-7B: alternate max-ent constraint updates on the current policy's replies with Lagrangian GRPO (dual ascent on lambda)
# ABOUTME: Run: CONFIG=configs/lagrangian_finetuning/secret_keeping_icrl_loop_qwen7b.yaml via scripts/slurm/run_secret_keeping_icrl_pipeline_job.sh (stages default to demos,base_eval,icrl_loop,evaluate)
run_name: secret_keeping_icrl_loop_qwen7b_v1

data:
  train_prompts: 2000     # training split: 20 businesses, 24 attack + 20 benign templates
  test_prompts: 400       # test split: 8 other businesses, 12 other attack + 10 other benign templates
  attack_share: 0.5
  seed: 0

policy:
  model: Qwen/Qwen2.5-7B-Instruct
  serve:
    replicas: ["0", "1", "2", "3"]
    tensor_parallel: 1
    max_model_len: 4096
    max_num_seqs: 128
    gpu_fraction: 0.85
    reasoning_parser: null
    tool_call_parser: null

sampling:
  k: 4                    # replies per prompt per arm (demos and fine-tuning rounds)
  temperature: 0.7
  max_tokens: 200
  workers: 128

constraint:
  encoder_model: Qwen/Qwen2.5-1.5B
  device: cuda:0
  max_length: 768
  head_hidden: 256
  loss: paired_bce
  pair_filter: higher_return   # unsafe demo = policy reply whose judge reward beats the oracle expert's (no leak labels); or any_different
  beta: 0.8
  lambda_c: 1.0
  n_iterations: 20
  n_constraint_steps: 50
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 0.01
  max_demos_per_class: 20000
  seed: 0

rl:
  judge_gpu: "3"               # frozen base model served here as the reward model (LLM judge)
  train_gpus: "0,1,2"          # GRPO processes; each colocates a vLLM copy of the policy for generation
  cost: maxent_feasibility     # cost = 1 - phi, phi from the current ICRL round (set by the loop)
  lambda_c: 1.0                # unused with dual ascent (lambda is applied inside the cost reward)
  dual:                        # Lagrangian: lambda <- clip(lambda + lr * (mean cost - epsilon), 0, max), every GRPO step
    lambda_init: 1.0
    lr: 0.05
    epsilon: 0.1               # cost budget
    max: 20.0
  num_generations: 8
  per_device_batch: 8
  grad_accum: 4
  max_completion_length: 200
  temperature: 1.0
  kl_beta: 0.01
  lr: 2.0e-5
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  vllm_gpu_memory_utilization: 0.35
  vllm_max_model_length: 1024
  seed: 0

icrl:                          # Malik et al. 2021 alternation; the loop sets rl.max_steps / resume / phi_dir per round
  rounds: 4
  grpo_steps_per_round: 150    # constraint retrained on the current policy every 150 RL steps (600 total, as grpo v2)
  k: 4                         # policy replies per training chat sampled each round for the inverse step
  beta: 1.0                    # likelihood scale (survey Eq. 20)
  sparsity_coeff: 0.05         # Malik regulariser toward feasible
  negative_selection: all      # plain Malik: every current-policy sample is a nominal (no PU filtering)
  inverse_method: maxent        # plain Malik et al. 2021 (maxent | maxent_paired | pucl)
  first_round_constraint_steps: 1000
  constraint_steps: 300        # warm-started rounds
  constraint_batch: 64
  constraint_lr: 1.0e-4

evaluation:
  k: 4
  temperature: 0.7

output:
  dir: ${oc.env:SCRATCH}/icrl/secret_keeping/${run_name}