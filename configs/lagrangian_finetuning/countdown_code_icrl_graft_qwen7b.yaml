# ABOUTME: ICRL + GRAFT on Countdown-Code: each round re-fits the constraint C_theta against the exploring policy, routes its flagged replies to FORGET, and trains the deployed policy (RETAIN only) on reward - lambda * cost, from the SFT-primed Qwen2.5-7B
# ABOUTME: Run: CONFIG=configs/lagrangian_finetuning/countdown_code_icrl_graft_qwen7b.yaml via scripts/slurm/run_single_turn_icrl_pipeline_job.sh (stages base_eval,icrl_graft_loop,evaluate)
benchmark: countdown_code
run_name: countdown_code_icrl_graft_qwen7b_v1

data:
  dir: ${oc.env:SCRATCH}/icrl/countdown_code/data   # built by scripts/prepare_countdown_code_data.py
  train_prompts: 4000          # RL problems, unseen in the demonstrations (Countdown-Code protocol)
  test_prompts: 500
  demonstrations: null         # all proxy-passing o4-mini traces (~1.2% of them hack; not filtered)

policy:
  model: ${oc.env:SCRATCH}/icrl/countdown_code/sft_primed_qwen2.5_7b
  serve:
    replicas: ["0", "1", "2", "3"]
    tensor_parallel: 1
    max_model_len: 4096
    max_num_seqs: 128
    gpu_fraction: 0.85
    reasoning_parser: null
    tool_call_parser: null

sampling:
  temperature: 0.7
  max_tokens: 2048
  workers: 64
  timeout_s: 1800

rl:
  signal: gradient_routing     # the reward is the proxy reward, unchanged; the monitor only decides which adapter a reply updates
  train_gpus: "0,1,2"          # the same three GPUs in every arm
  num_generations: 8           # as the other arms (GRAFT paper: 16)
  per_device_batch: 2
  grad_accum: 20               # 3 GPUs x 2 x 20 = 120 replies = 15 prompts per step
  steps_per_generation: 40     # one generation feeds 2 optimizer steps, as the other arms
  max_steps: 1250              # as the other arms (GRAFT paper: 200 steps of 1,024 + 64 replies)
  save_steps: 125
  max_completion_length: 2048
  temperature: 1.0
  kl_beta: 0.0                 # no KL term (GRAFT paper, Appendix G.3)
  lr: 1.67e-4                  # GRAFT paper, Appendix G.3; the other arms' 3e-6 is a LoRA learning rate
  vllm_gpu_memory_utilization: 0.35
  vllm_max_model_length: 3072
  seed: 0

constraint:
  encoder_model: Qwen/Qwen2.5-1.5B   # frozen; only the MLP head is trained (as the ICRL arm)
  device: cuda:0
  max_length: 1024
  head_hidden: 256
  input: files                 # files = the returned files (as the ICRL arm); scaffold_changes = only what the reply changed in the provided files, answer masked

graft:
  adapter_width: 64            # neurons per layer in each of RETAIN and FORGET (GRAFT paper, Qwen3-8B)
  forget_amplification: 2.0    # FORGET's gradient on flagged replies (Algorithm 1 line 9)
  routing: true
  monitor: learned_constraint  # C_theta, re-fitted every round by the icrl_graft_loop stage (phi_dir is set per round)
  flag_quantile_of_demonstrations: 0.95   # a reply is flagged if its cost is above the cost of 95% of the demonstrations
  anchor:
    kind: constrained_target   # the deployed policy (RETAIN only) on Countdown-Code itself, trained on reward - lambda * cost
    fraction: 0.2              # share of prompts answered by the deployed policy (GRAFT paper's toy setup: 128 of 640)
    dual: {lambda_init: 1.0, lr: 0.05, epsilon: 0.1, max: 20.0}   # as the ICRL arm: lambda <- clip(lambda + lr (mean cost - epsilon), 0, max)
  optimizer:                   # split-moment AdamW, GRAFT paper Eq. 1 and Appendix G.3
    beta2: 0.99
    weight_decay: 0.1
    max_grad_norm: 0.2
    warmup_steps: 20
    scheduler: cosine

icrl:                          # the inverse step, as the ICRL arm; 10 rounds x 125 steps = 1,250 GRPO steps
  rounds: 10
  grpo_steps_per_round: 125
  k: 4                         # round 1 only: samples per prompt from the starting model
  sample_prompts: 500
  exploring_replies: 2000      # later rounds: the exploring policy's most recent training replies
  expert_demos: 4000
  reward_filter: true          # PUCL Eq. 6: the unlabelled set is the reward-earning replies
  min_nominal: 64
  beta: 1.0
  sparsity_coeff: 0.05
  negative_selection: all      # unused by the PUCL path
  inverse_method: pucl
  pucl_keep_fraction: 0.3      # share of the unlabelled set taken as reliably forbidden (as the ICRL arm)
  pucl_k: 2
  first_round_constraint_steps: 1000
  constraint_steps: 300
  constraint_batch: 64
  constraint_lr: 1.0e-4

evaluation:
  k: 4
  temperature: 0.7

output:
  dir: ${oc.env:SCRATCH}/icrl/countdown_code/${run_name}
