# ABOUTME: Root Hydra config with defaults shared by every pipeline stage (paths, data splits, compute, wandb).
# ABOUTME: Loaded by every scripts/*.py Hydra entrypoint via config_name="base"; groups merged with +compute=... etc.
project_name: icrl-safety
run_name: ???
seed: 42
output_dir: outputs/${run_name}

compute:
  backend: local
  num_gpus: 1
  precision: bf16
  dataloader_workers: 4

paths:
  data_root: data/
  # null → HuggingFace's own cache (HF_HOME / ~/.cache/huggingface/hub). Pointing
  # cache_dir at ~/.cache/huggingface directly makes HF ignore the existing hub/
  # tree and re-download every model into a second copy. On the cluster set
  # HF_HOME=$SCRATCH/hf_cache instead of setting this.
  model_cache: null
  checkpoint_dir: checkpoints/
  log_dir: logs/
  benchmark_root: ${oc.env:STWEBAGENT_ROOT,""}

# Demo splits produced by scripts/make_demo_splits.py, relative to paths.data_root.
# Training reads the train split; the gate check reads the held-out split.
data:
  train_safe: train/safe.jsonl
  train_unsafe: train/unsafe.jsonl
  eval_safe: eval/safe_held_out.jsonl
  eval_unsafe: eval/unsafe_held_out.jsonl

wandb:
  # Off by default so every stage runs without a wandb login. Turn on with
  # `wandb.enabled=true wandb.entity=<your-entity>`.
  enabled: false
  project: icrl-safety
  entity: null
